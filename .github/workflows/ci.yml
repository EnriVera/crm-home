name: CI

# PRD-v4 §18: el repo no tenía CI. Este workflow corre la línea de base del
# proyecto: typecheck + lint + tests de los paquetes vivos, la suite de
# integración de la API contra Postgres, y un smoke e2e de web-v3.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela la corrida anterior del mismo ref: no hace falta esperar la cola.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  # ─── Linting + typecheck + tests unitarios (sin base de datos) ───────────
  #
  # `apps/web` (@crm/web) queda EXCLUIDO a propósito: es la app legacy
  # congelada (la vigente es `apps/web-v3`) y su typecheck ya no pasa
  # (123 errores TS). Incluirla haría que TODO el CI esté rojo por código que
  # nadie va a tocar.
  # El filtro de turbo es explícito por paquete para que quede claro qué
  # se verifica.
  verify:
    name: verify (typecheck + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencias
        run: bun install --frozen-lockfile

      # `@crm/api` importa `@crm/email`, que se publica como `dist/`. Ese
      # `dist/` está en `.gitignore` y `bun install` NO lo construye.
      - name: Build de @crm/email
        run: bun run build --filter=@crm/email

      - name: Typecheck
        run: |
          bun run typecheck --filter=@crm/contract --filter=@crm/types --filter=@crm/email --filter=@crm/api --filter=@crm/web-v3

      - name: Lint
        run: |
          bun run lint --filter=@crm/contract --filter=@crm/types --filter=@crm/api --filter=@crm/web-v3

      - name: Test (unitarios)
        run: |
          bun run test --filter=@crm/contract --filter=@crm/types --filter=@crm/email --filter=@crm/web-v3

      # El typecheck de la app no ve `tests/e2e` (el tsconfig de Nuxt solo
      # incluye `tests/nuxt`): el smoke e2e necesita su propio chequeo.
      - name: Typecheck (e2e)
        working-directory: apps/web-v3
        run: bun run typecheck:e2e

  # ─── Integración de la API contra Postgres ───────────────────────────────
  #
  # La suite de integración de `apps/api` necesita un Postgres real: usa
  # `TEST_DATABASE_URL` y su guardarraíl (`src/infrastructure/kysely/test-db.ts`)
  # aborta si la base no termina en `_test` o si la conexión real no es la de
  # test. Los tests BORRAN tablas, así que la base de desarrollo nunca puede
  # ser el destino: acá se crea `crm_home_test` aparte.
  integration:
    name: integration (api + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mailpit: el test de integración del sender SMTP necesita un SMTP
      # local (SMTP_URL=smtp://localhost:1025).
      mailpit:
        image: axllent/mailpit:v1.24
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # La base de TEST de la API. El sufijo `_test` es obligatorio: el
      # guardarraíl aborta la suite si no lo tiene.
      TEST_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_home_test
      # Vacía a propósito: durante los tests `DATABASE_URL` se apunta a la
      # base de test en runtime. Si quedara con la URL de desarrollo, código
      # que la lea por fuera de los tests tocaría `crm_home`.
      DATABASE_URL: ""
      SMTP_URL: smtp://localhost:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencias
        run: bun install --frozen-lockfile

      # `@crm/api` importa `@crm/email`, que se publica como `dist/`. Ese
      # `dist/` está en `.gitignore` y `bun install` NO lo construye: sin
      # este paso la suite falla con "Cannot find module '@crm/email'".
      - name: Build de @crm/email
        run: bun run build --filter=@crm/email

      # `apps/api/.env.test` está en `.gitignore` (sólo existe el
      # `.example`). `bun run test:db` lo pasa con `--env-file`, así que se
      # copia el ejemplo: el sufijo `_test` de la URL y el `DATABASE_URL`
      # vacío son los que el guardarraíl exige.
      - name: Preparar apps/api/.env.test
        run: cp apps/api/.env.test.example apps/api/.env.test

      # La base de test la crea el propio bootstrap de la suite
      # (`ensureTestSchema`), que además aplica las migraciones pendientes.
      - name: Test de integración (api)
        working-directory: apps/api
        run: bun run test:db

  # ─── E2E de web-v3 ───────────────────────────────────────────────────────
  #
  # Smoke e2e del camino de login contra la app real: la API y el Nuxt de
  # `apps/web-v3` levantados, con Postgres y Mailpit detrás.
  e2e:
    name: e2e (web-v3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.24
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm_home
      SMTP_URL: smtp://localhost:1025
      # La cookie de sesión va `secure` salvo que se lo diga lo contrario;
      # en CI el browser habla http://localhost, así que tiene que bajar.
      SESSION_COOKIE_SECURE: "false"
      WEB_ORIGINS: http://localhost:5175
      # La cola `email_sending` la drena la API cada 60 s por defecto: el
      # código de acceso tardaría más de lo que espera el test. Con 2 s el
      # correo llega antes del timeout.
      EMAIL_DRAIN_INTERVAL_MS: "2000"
      MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencias
        run: bun install --frozen-lockfile

      - name: Build de @crm/email
        run: bun run build --filter=@crm/email

      - name: Preparar la base
        working-directory: apps/api
        run: bun run db:migrate

      - name: Install browsers de Playwright
        working-directory: apps/web-v3
        run: bunx playwright install --with-deps chromium

      # `wait-on` no es dependencia del repo: se usa npx para no sumar un
      # paquete al lockfile por una herramienta de CI.
      - name: Levantar la API
        working-directory: apps/api
        run: |
          bun run dev > /tmp/api-dev.log 2>&1 &
          npx --yes wait-on http://localhost:3000/health --timeout 120000
          tail -20 /tmp/api-dev.log

      - name: Levantar web-v3
        working-directory: apps/web-v3
        run: |
          bun run dev > /tmp/web-dev.log 2>&1 &
          npx --yes wait-on http://localhost:5175 --timeout 180000
          tail -20 /tmp/web-dev.log

      - name: E2E
        working-directory: apps/web-v3
        run: bunx playwright test

      # El reporte de Playwright es lo único que sobrevive a la corrida:
      # sin esto, un fallo deja sólo el log de la consola.
      - name: Subir el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-v3/playwright-report
            apps/web-v3/test-results
          retention-days: 7
          if-no-files-found: ignore
