services:
  postgres:
    image: postgres:17-alpine
    container_name: crm-home-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_home
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_home"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crm_pgdata:
