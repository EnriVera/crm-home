<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CRM-Home</title>
    <script>
      // Theme bootstrap (PRD-v3 §8.3). Runs before any render to avoid a
      // flash of the wrong theme. Reads the system preference until the
      // auth boot resolves the user.user_theme value.
      (function () {
        try {
          var stored = localStorage.getItem("crm-theme-preference");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved = theme === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
          document.documentElement.classList.toggle("dark", resolved === "dark");
        } catch (_) {
          /* localStorage unavailable; default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
