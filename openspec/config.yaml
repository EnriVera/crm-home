# OpenSpec SDD configuration — CRM-HOME
# Generado por sdd-init.
# Fuente de verdad del producto: docs/PRD-v2.md y PRODUCT.md.

project:
  name: crm-home
  description: >
    CRM-HOME — app web multi-user para freelancers: tareas + time-tracking +
    finanzas sobre un único modelo de datos (tipos, categorías y clientes
    compartidos).
  repo_root: /run/media/enri/DISCO DURO/crm-home/crm
  platform: web
  # español por defecto; todas las cadenas en i18next desde el día uno
  language_ui: es
  docs:
    # fuente única de verdad del producto (PRD.md es histórico)
    prd: docs/PRD-v2.md
    product: PRODUCT.md

stack:
  architecture: >
    monolito-monorepo (turborepo); frontend atomic design; backend clean
    architecture (ports & adapters)
  runtime: bun # runtime y package manager
  backend:
    server: [nitro, h3]
    rpc: orpc
    db: [kysely, postgresql]
    extra: [vite, effect, xstate, shiki, opentelemetry-otlp]
  frontend:
    framework: octanejs (tsrx)
    build: vite
    styling: [tailwindcss, "@fontsource/poppins"]
    # alineado por stack-alignment (D-SA1…D-SA8); bindings pineados exactos
    adoptados:
      - "@octanejs/zag@0.0.18 + @zag-js/pin-input (OtpInput; D-SA1)"
      - "@octanejs/phosphor-icons@0.0.32 (Icons; D-SA8)"
      - "@octanejs/resizable-panels@0.0.10 (sidebar resizable; D-SA6)"
      - "@octanejs/sonner@0.1.47 (Toast; D-SA5)"
      # cohorte PARCIAL host-safe (useBoolean, useCounter, useToggle,
      # useMap, useStep, useDebounceCallback, useDebounceValue,
      # useInterval, useTimeout, useIsMounted, useUnmount); ausentes
      # storage/media/DOM-observer: variante en el change consumidor
      - "@octanejs/usehooks-ts@0.0.34 (cohorte parcial; D-SA5)"
      - "@octanejs/xstate@0.0.10 + xstate (FSM otp web + api; D-SA4/D-SA7)"
      - "effect (api y web; wiring real diferido a adapter consumidor)"
      # gate D-SA3 ejecutado (rama B): integración propia mantenida como
      # variante equivalente §9; se re-evalúa @octanejs/i18next cuando un
      # change necesite Trans/ICU/pluralización o el contrato crezca
      - "i18next (integración propia; gate de re-evaluación abierto)"
    no_aplican:
      - "tanstack router / router-ssr-query (router MPA propio de Octane)"
      - "nuqs (estado en URL vía URLSearchParams del router propio)"
      # D-SA2: octane@0.2.3 expone ErrorBoundary/@try-@catch nativos;
      # divergencia component-stack vacío documentada; wiring de raíz
      # diferido al primer change con UI de error
      - "@octanejs/react-error-boundary (ErrorBoundary nativa de Octane)"
    diferidos:
      - "@octanejs/lexical → change tasks (rich text)"
      - "@octanejs/dnd-kit → change tasks (kanban)"
      - "day-picker → change schedule"
      # SSR no testeado; Brush/Treemap no soportados
      - "@octanejs/recharts → change schedule"
      - "colorful → change config (categorías)"
      - "tanstack store/db/query/form/table/virtual → change data layer"
      - "spring → primer change con animación"
      - "testing-library → primer test DOM"
      - "shiki → sin consumidor"
  binding_rules:
    - >
      Ports & adapters en backend: el dominio NO importa kysely, h3, nitro ni
      SDKs externos; solo los adapters.
    - >
      Wrappers de librerías en frontend: ninguna herramienta de terceros se
      importa desde la lógica de negocio.
    - "Multi-user con aislamiento total: ninguna query cruza usuarios."
    - "Saldos y estado calculados, no mutados."
    - >
      El websocket solo transporta eventos de invalidación y heartbeat del
      timer; ningún CRUD depende de él.

testing:
  runner: bun test
  # workspace raíz (cuando exista el scaffold del monorepo; hoy no hay código)
  scope: workspace-root
  strict_tdd: true
  tdd_exceptions:
    - change: monorepo-scaffold
      reason: >
        Configuración de infraestructura sin lógica de negocio. Excepción
        puntual aceptada explícitamente por el usuario (size:exception). NO
        debilita el strict_tdd para lógica de negocio: todo cambio posterior
        con lógica de dominio/aplicación sigue ciclo red-green-refactor con
        tests primero.

git:
  branches:
    main: producto (permanente)
    develop: desarrollo activo (permanente; rama actual)
  commits:
    convention: conventional-commits
    # hook commit-msg activo con @commitlint/config-conventional
    enforced_by: [husky, commitlint]

sdd:
  artifact_store: openspec
  execution: auto
  delivery_strategy:
    default: ask-on-risk
    exceptions:
      - change: monorepo-scaffold
        # usuario aceptó size:exception explícitamente
        strategy: exception-ok
  # líneas; PRs mayores se evalúan para split (chained-pr)
  review_budget: 400

phases:
  order: [init, specify, plan, tasks, implement, verify, archive]
  rules:
    specify: >
      specs en español, alineadas a docs/PRD-v2.md (módulos §8,
      transversales §9)
    plan: >
      respetar reglas arquitectónicas vinculantes (ports & adapters /
      wrappers)
    implement: >
      strict_tdd según testing.strict_tdd; excepciones solo las listadas en
      testing.tdd_exceptions
    verify: >
      bun test verde en workspace raíz + cumplimiento de acceptance criteria
      del spec

product_principles:
  - Un solo modelo de datos para trabajo, tiempo y dinero.
  - >
    El timer nunca pierde tiempo (heartbeat 30 s; sobrevive cierres y cruce
    de medianoche).
  - >
    Aislamiento de herramientas: cambiar librería/proveedor = cambiar un
    adapter.
  - Accesibilidad WCAG 2.2 AA en ambos temas (claro/oscuro).
